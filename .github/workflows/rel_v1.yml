name: rel_v1_branch 
on:
    push:
        branches:
            - rel_v1
jobs:
    maven_build_job:
        runs-on: ubuntu-latest
        permissions:
          contents: read
          packages: write
          security-events: write

        steps:
            - name: get the code
              uses: actions/checkout@v4
            - name: setup java
              uses: actions/setup-java@v3
              with:
                java-version: '17'
                distribution: 'temurin'
                server_id: github
                settings-path: ${{ github.workspace }}
            - name: cache maven dependencies   
              uses: actions/cache@v4
              with:
                path: ~/.m2/repository
                key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
                restore-keys: ${{ runner.os }}-maven-     
        
            - name: publish package
              run: mvn clean package -Dcheckstyle.skip=true
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


            - name: publish the test result
              uses: EnricoMi/publish-unit-test-result-action@v2
              with:
                files: "**/target/surefire-reports/**/*.xml"
                comment_mode: always
    docker_build_job:
        runs-on: ubuntu-latest
        steps:
            - name: get the code
              uses: actions/checkout@v4
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
            - name: login into github container registery
              uses: docker/login-action@v3  
              with:
                registry: ghcr.io
                username: ${{ github.actor}}
                password: ${{ secrets.GITHUB_TOKEN}}

            - name: extract metadata
              id: meta
              uses: docker/metadata-action@v5    
              with: 
                images: ghcr.io/${{ github.repository_owner }}/petclinic
                

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                push: true
                context: .
                tags: |
                  ghcr.io/chaisiv/petclinic:latest
                  ghcr.io/chaisiv/petclinic:${{ github.sha }}

                  
                           